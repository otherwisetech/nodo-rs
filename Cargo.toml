[workspace]
resolver = "2"
members = ["crates/i18n", "crates/core", "crates/cli", "crates/app"]
default-members = ["crates/i18n", "crates/core", "crates/cli"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/otherwisetech/nodo-rs"

[workspace.dependencies]
nodo-core = { path = "crates/core" }
i18n = { path = "crates/i18n", package = "nodo-i18n" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared layer of the Otherwise apps: deep links, Today feed, entity registry (by tag, never a branch)
otherwise-link = { git = "https://github.com/otherwisetech/otherwise-link", tag = "v0.2.0" }
uuid = { version = "1", features = ["v4"] }
# GPUI stack, same as rama-rs, genealogy-rs and diskmap. Git deps move: Cargo.lock pins revs.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
# the embedded terminal: same alacritty fork and rev as Zed and plate
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }

[profile.dev]
opt-level = 1
# GPUI with debuginfo is ~10 GB of target/; keep it lean
debug = 0
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
